name: Update flake.lock

on:
  workflow_dispatch:
  schedule:
    # Weekly, Sunday 00:00 UTC. Covers every pinned input in flake.nix
    # (nixpkgs, disko, colmena, sops-nix, nixos-anywhere) in one PR, since
    # they're all tracked together in flake.lock.
    - cron: "0 0 * * 0"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@main
        with:
          pr-title: "chore(flake): update flake.lock"
          pr-labels: |
            dependencies
            automated
